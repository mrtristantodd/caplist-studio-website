name: Deploy to HostGator

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.HOSTGATOR_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy static export over FTP
        shell: bash
        env:
          FTP_HOST: ${{ secrets.HOSTGATOR_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTGATOR_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:passive-mode true
          set ftp:ssl-allow no
          mirror --reverse --delete --verbose --parallel=4 \
            --exclude-glob .htaccess \
            --exclude-glob .ftpquota \
            --exclude-glob .well-known \
            --exclude-glob '.well-known/**' \
            --exclude-glob cgi-bin \
            --exclude-glob 'cgi-bin/**' \
            out/ /
          bye
          EOF

      - name: Verify production homepage
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/caplist-home.html -w '%{http_code}' https://capliststudio.com/ || true)
            if [ "$code" = "200" ] && grep -qi "Caplist Studio" /tmp/caplist-home.html; then
              echo "Production homepage verified."
              exit 0
            fi
            echo "Verification attempt $attempt failed with HTTP $code; retrying..."
            sleep 5
          done
          echo "Production verification failed."
          exit 1
